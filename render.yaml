# Despliegue en Render (Blueprint). La demo corre completa en el servidor:
# Ganache vive dentro del mismo proceso y la página lo consulta por /rpc.
# En el plan gratis el disco no es persistente: tras un reinicio o una suspensión
# el contrato vuelve a quedar sin sellar y se sella de nuevo desde la vista Sellar.
services:
  - type: web
    name: reto-03-indicador-recomputable
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node scripts/start.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0

  # Portal del proveedor (Nivel 2): servicio SEPARADO, sitio estático con su propia dirección web.
  # Publica solo la carpeta portal-proveedor/: HTML, CSS y JS que leen Sepolia por RPC público y
  # firman con la MetaMask del proveedor. No comparte estado con el servicio del municipio.
  # Después de crearlo, en el servicio del municipio se configura PORTAL_PROVEEDOR_URL con su dirección.
  - type: web
    name: portal-proveedor
    runtime: static
    buildCommand: echo "Sitio estático: sin compilación"
    staticPublishPath: ./portal-proveedor
    autoDeploy: true
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
